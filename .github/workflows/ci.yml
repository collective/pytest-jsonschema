name: "pytest-jsonschema CI"

on:
  push:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:

        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.1.0
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Check formatting
          if: ${{ success() || failure() }}
          id: ruff-format
          run: uvx ruff@latest format --diff

        - name: Check lint
          if: ${{ success() || failure() }}
          id: ruff-lint
          run: uvx ruff@latest check --diff

        - name: Check XML / ZCML
          if: ${{ success() || failure() }}
          id: zpretty
          run: uvx zpretty@latest --check src

        - name: Check Package Metadata
          if: ${{ success() || failure() }}
          id: pyroma
          run: uvx pyroma@latest -d .

        - name: Check Python Versions
          if: ${{ success() || failure() }}
          id: py-versions
          run: uvx check-python-versions@latest .

        - name: Check typing
          if: ${{ success() || failure() }}
          id: typing
          run: |
            make install
            uv run mypy src

        - name: Report
          if: ${{ success() || failure() }}
          run: |
            echo '# Code Analysis' >> $GITHUB_STEP_SUMMARY
            echo '| Test | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
            echo '| Format | ${{ steps.ruff-format.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Lint | ${{ steps.ruff-lint.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| XML / ZCML | ${{ steps.zpretty.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Package Metadata | ${{ steps.pyroma.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Python Versions | ${{ steps.py-versions.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Typing | ${{ steps.typing.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY

  test:
    name: "Test on Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    # 3.15 is still a pre-release; report it without blocking the build.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:

        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.1.0
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Install Package
          run: make install

        - name: Run tests
          run: make test

  report:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:

      - name: Report
        shell: bash
        run: |
          echo '# Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job | Status |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ✅ |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ✅ |' >> $GITHUB_STEP_SUMMARY
