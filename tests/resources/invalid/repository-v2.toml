# Two spec 2 violations: `type` is required on every [[package]] entry and has
# no default, and a mistyped key is an error because the package schema sets
# additionalProperties to false.
spec_version = "2"

[repository]
name = "acme-site"
changelog = "CHANGELOG.md"
version = "version.txt"

[[package]]
name = "acme.core"
path = "backend"
changelog = "backend/CHANGELOG.md"
towncrier_settings = "backend/pyproject.toml"
publsh = true
